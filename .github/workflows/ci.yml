name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install & build app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Lint app
        working-directory: app
        run: npm run lint

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP backend (syntax check)
        run: |
          for f in $(find server-php -name '*.php'); do php -l "$f"; done

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble the site to publish
        run: |
          rm -rf publish
          mkdir -p publish/api
          cp -R app/dist/. publish/
          cp -R server-php/. publish/api/
          rm -f publish/api/config.example.php
          cp deploy/root.htaccess publish/.htaccess
          cp deploy/cpanel.yml publish/.cpanel.yml

      - name: Publish to deploy branch
        id: publish
        working-directory: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy build from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin deploy
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger self-deploy on the live host
        continue-on-error: true
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          curl -sS -X POST https://deliarte.ir/api/setup/self-deploy \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${DEPLOY_TOKEN}\",\"sha\":\"${DEPLOY_SHA}\"}" \
            --fail-with-body
